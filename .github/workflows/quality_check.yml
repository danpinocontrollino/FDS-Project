name: Code Quality & Safety Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true
        pip install pytest flake8 || true

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Run Safety Logic Tests
      run: |
        pytest tests/test_safeguards.py || true

    - name: Model Artifact Check
      run: |
        if [ ! -f "models/saved/mental_health_lstm.pt" ]; then
          echo "ERROR: Production model missing!"
          exit 1
        fi
